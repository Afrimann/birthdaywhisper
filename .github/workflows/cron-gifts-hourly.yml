name: Hourly gift withdrawal-nudge cron

# Vercel's Hobby plan only permits daily cron execution (see the
# vercel.json history — commit 5a560d3 walked back an earlier 5-minute
# schedule for exactly this reason). Timezone-aware, same-day nudging (so a
# recipient learns their gifts are withdrawable on their actual local
# birthday, not the server's) needs hourly ticks, so this workflow calls the
# already-secret-gated /api/cron/gifts endpoint directly. Actual disbursement
# is owner-initiated via POST /api/payouts/withdraw, not done by this cron.
# The existing daily Vercel Cron entry is left in place as a zero-cost safety
# net if this ever goes dark for a day.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    name: Trigger /api/cron/gifts
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/gifts")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "Cron endpoint returned HTTP $status"
            exit 1
          fi
